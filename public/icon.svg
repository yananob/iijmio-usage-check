<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Main Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="8" opacity="0.5" />

  <!-- Signal / Data Usage Bar Chart -->
  <g transform="translate(80, 110)">
    <!-- Bar 1 -->
    <rect x="20" y="160" width="64" height="120" rx="16" fill="url(#barGrad1)" />

    <!-- Bar 2 -->
    <rect x="114" y="100" width="64" height="180" rx="16" fill="url(#barGrad2)" />

    <!-- Bar 3 -->
    <rect x="208" y="30" width="64" height="250" rx="16" fill="url(#barGrad3)" />

    <!-- Trend Arrow & Line -->
    <path d="M 20 140 Q 146 80 280 20" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <polygon points="285,10 290,38 260,28" fill="#38bdf8" />

    <!-- Base Line -->
    <line x1="0" y1="292" x2="352" y2="292" stroke="#475569" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- IIJmio Badge Text -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="#f8fafc" letter-spacing="2">IIJmio USAGE</text>
</svg>
